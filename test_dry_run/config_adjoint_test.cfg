% ------- SU2 Discrete Adjoint Configuration -------
% Generated by airfoil_discovery.aso.config_adjoint
% Objective: DRAG

% ------------ Solver ------------
SOLVER= RANS
MATH_PROBLEM= DISCRETE_ADJOINT
RESTART_SOL= NO

% ------------ Objective Function ------------
OBJECTIVE_FUNCTION= DRAG_COEFFICIENT

% ------------ Design Variables (Surface) ------------
DV_KIND= SURFACE
DV_PARAM= ( AIRFOIL, 0.0, 100.0 )
DV_MARKER= ( airfoil )

% ------------ Mesh (same as primal) ------------
MESH_FILENAME= airfoil_perfect.su2
MESH_FORMAT= SU2

% ------------ Boundary Conditions (same as primal) ------------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( airfoil )
MARKER_PLOTTING= ( airfoil )

% ------------ Adjoint Numerical Method ------------
CONV_NUM_METHOD_FLOW= JST
CONV_NUM_METHOD_TURB= JST
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= LEAST_SQUARES

% ------------ MUSCL for Adjoint ------------
MUSCL_FLOW= NO
MUSCL_TURB= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
SLOPE_LIMITER_TURB= VENKATAKRISHNAN

% ------------ Time Integration ------------
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER_ADJFLOW= 1.0
CFL_NUMBER_ADJTURB= 1.0
CFL_ADAPT= NO

% ------------ Iterations ------------
ITER= 50

% ------------ Linear Solver ------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-10
LINEAR_SOLVER_ITER= 20

% ------------ Adjoint-Specific ------------
ADJ_MACH_NUMBER= 0.8
ADJ_AOA= 1.25
ADJ_SIDESLIP_ANGLE= 0.0
ADJ_REYNOLDS_NUMBER= 6500000.0
ADJ_FREESTREAM_TEMPERATURE= 288.15
ADJ_FREESTREAM_PRESSURE= 101325.0

% ------------ Output ------------
TABULAR_FORMAT= CSV
CONV_FILENAME= history_adj
RESTART_FILENAME= restart_adj
VOLUME_FILENAME= adjoint
SURFACE_FILENAME= surface_adjoint
OUTPUT_FILES= (RESTART, SURFACE_CSV)
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= (INNER_ITER, RMS_RES)
HISTORY_OUTPUT= (INNER_ITER, RMS_RES)
CONV_STARTITER= 10
OUTPUT_DIR= .