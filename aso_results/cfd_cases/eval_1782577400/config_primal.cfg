% ------- SU2 Primal Configuration -------
% Generated by airfoil_discovery.aso.config_primal
% Reynolds = 1.0e+05, Mach = 0.1, AoA = 4.0 deg

% ------------ Solver ------------
SOLVER= INC_RANS
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ------------ Turbulence Model ------------
KIND_TURB_MODEL= SST
KIND_TRANS_MODEL= LM

% ------------ Compressibility ------------
INC_DENSITY_MODEL= CONSTANT
INC_VELOCITY_INIT= ( 1.0, 0.0, 0.0 )

% ------------ Freestream ------------
MACH_NUMBER= 0.1
AOA= 4.0
SIDESLIP_ANGLE= 0.0
REYNOLDS_NUMBER= 100000.0
REYNOLDS_LENGTH= 1.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ------------ Transition Model Parameters ------------
FREESTREAM_TURBULENCEINTENSITY= 0.001
FREESTREAM_TURB2LAMVISCRATIO= 5.0

% ------------ Mesh ------------
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

% ------------ Boundary Conditions ------------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( airfoil )
MARKER_PLOTTING= ( airfoil )
MARKER_EULER= ( symmetry )

% ------------ Numerical Method ------------
CONV_NUM_METHOD_FLOW= FDS
CONV_NUM_METHOD_TURB= ROE_TURB
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= LEAST_SQUARES

% ------------ MUSCL & Limiter ------------
MUSCL_FLOW= YES
MUSCL_TURB= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
SLOPE_LIMITER_TURB= VENKATAKRISHNAN_WANG
VENKATKRISHNAN_WANG_LIMITER_COEFF= 0.05

% ------------ Time Integration ------------
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 1.5
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 1.5, 3.0, 1.5, 100.0 )

% ------------ Iterations ------------
ITER= 20
INNER_ITER= 0

% ------------ Linear Solver ------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-6
LINEAR_SOLVER_ITER= 10

% ------------ Output ------------
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_CSV)
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= (INNER_ITER, RMS_RES, AERO_COEFF)
HISTORY_OUTPUT= (INNER_ITER, RMS_RES, AERO_COEFF)
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1e-6
OUTPUT_DIR= .