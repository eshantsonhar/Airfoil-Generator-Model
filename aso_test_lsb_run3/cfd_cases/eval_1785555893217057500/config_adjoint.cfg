% ------- SU2 Continuous Adjoint Configuration -------
% Generated by airfoil_discovery.aso.config_adjoint
% Objective: DRAG

% ------------ Solver ------------
SOLVER= RANS
MATH_PROBLEM= CONTINUOUS_ADJOINT
RESTART_SOL= YES

% ------------ Objective Function ------------
OBJECTIVE_FUNCTION= DRAG

% ------------ Mesh (same as primal) ------------
MESH_FILENAME= mesh_deformed.su2
MESH_FORMAT= SU2

% ------------ Boundary Conditions (same as primal) ------------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( airfoil )
MARKER_PLOTTING= ( airfoil )

% ------------ Turbulence Model ------------
KIND_TURB_MODEL= SST
KIND_TRANS_MODEL= LM

% ------------ Freestream / Flow Reference ------------
MACH_NUMBER= 0.1
AOA= 4.0
SIDESLIP_ANGLE= 0.0
REYNOLDS_NUMBER= 100000.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0

% ------------ Adjoint Numerical Method ------------
CONV_NUM_METHOD_FLOW= JST
CONV_NUM_METHOD_ADJFLOW= JST
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= LEAST_SQUARES

% ------------ MUSCL for Adjoint ------------
MUSCL_FLOW= NO
MUSCL_TURB= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
SLOPE_LIMITER_TURB= VENKATAKRISHNAN

% ------------ Time Integration ------------
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_ADJFLOW= 1.0
CFL_REDUCTION_ADJTURB= 1.0
CFL_ADAPT= NO

% ------------ Iterations ------------
ITER= 300

% ------------ Linear Solver ------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-10
LINEAR_SOLVER_ITER= 20

% ------------ Output ------------
TABULAR_FORMAT= CSV
CONV_FILENAME= history_adj
RESTART_FILENAME= restart_adj
VOLUME_FILENAME= adjoint
SURFACE_FILENAME= surface_adjoint
OUTPUT_FILES= (RESTART, SURFACE_CSV)
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= (INNER_ITER, RMS_RES)
HISTORY_OUTPUT= (INNER_ITER, RMS_RES)
CONV_STARTITER= 10
SOLUTION_FILENAME= solution_adj_cd.dat