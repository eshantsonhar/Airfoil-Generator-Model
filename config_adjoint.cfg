% ------- SU2 Continuous Adjoint Configuration -------
% Phase 4 Audit: Adjoint Gradient Verification
% Objective: Minimize Drag Coefficient (Cd)

% ------------ Solver ------------
SOLVER= RANS
MATH_PROBLEM= CONTINUOUS_ADJOINT
RESTART_SOL= NO

% ------------ Turbulence Model ------------
KIND_TURB_MODEL= SST

% ------------ Compressibility ------------
INC_DENSITY_MODEL= CONSTANT
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.78e-5

% ------------ Freestream ------------
MACH_NUMBER= 0.1
AOA= 4.0
SIDESLIP_ANGLE= 0.0
REYNOLDS_NUMBER= 100000.0
REYNOLDS_LENGTH= 1.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ------------ Transition Model Parameters ------------
FREESTREAM_TURBULENCEINTENSITY= 0.001
FREESTREAM_TURB2LAMVISCRATIO= 5.0

% ------------ Objective Function ------------
OBJECTIVE_FUNCTION= DRAG

% ------------ Design Variables (Surface) ------------
DV_KIND= HICKS_HENNE
DV_PARAM= ( 8, 0.1, 0.5 )
DV_MARKER= ( airfoil )

% ------------ Mesh (same as primal) ------------
MESH_FILENAME= airfoil.su2
MESH_FORMAT= SU2

% ------------ Boundary Conditions (same as primal) ------------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( airfoil )
MARKER_PLOTTING= ( airfoil )

% ------------ Adjoint Numerical Method ------------
CONV_NUM_METHOD_FLOW= JST
CONV_NUM_METHOD_ADJFLOW= JST
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= LEAST_SQUARES

% ------------ MUSCL for Adjoint ------------
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
VENKAT_LIMITER_COEFF= 0.05

% ------------ Time Integration ------------
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1.0

% ------------ Iterations ------------
ITER= 500

% ------------ Linear Solver ------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-10
LINEAR_SOLVER_ITER= 20

% ------------ Output ------------
TABULAR_FORMAT= CSV
CONV_FILENAME= history_adj
RESTART_FILENAME= restart_adj
VOLUME_FILENAME= adjoint
SURFACE_FILENAME= surface_adjoint
OUTPUT_FILES= (RESTART, SURFACE_CSV)
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= (INNER_ITER, RMS_RES)
HISTORY_OUTPUT= (INNER_ITER, RMS_RES)
CONV_STARTITER= 10
