[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airfoil-discovery"
version = "0.1.0"
description = "Machine-learning-driven discovery of manufacturable low-Reynolds-number 2D airfoils using CST and SU2."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "OpenAI Codex"}
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0.1",
  "requests>=2.32",
  "joblib>=1.4",
  "tqdm>=4.66"
]

[project.optional-dependencies]
ml = ["xgboost>=2.0"]
meshing = ["gmsh>=4.12"]
ui = ["fastapi[standard]>=0.114.0", "uvicorn>=0.30.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
