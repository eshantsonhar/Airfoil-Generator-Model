% ------- SU2 Primal Configuration (FIXED) -------
% Re = 100000.0, Mach = 0.1, AoA = 4.0 deg
% Non-dimensionalization: chord = 1.0 m, U = 1.0 m/s, rho = 1.225 kg/m3
% mu = rho * U * chord / Re = 1.225e-5 Pa.s  (so Re = rho*U*c/mu = 1e5 exactly)

% ------------ Solver ------------
SOLVER= INC_RANS
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ------------ Turbulence Model ------------
KIND_TURB_MODEL= SST
KIND_TRANS_MODEL= NONE

% ------------ Compressibility ------------
INC_DENSITY_MODEL= CONSTANT
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.22500000e-05
INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= ( 0.99756405, 0.06975647, 0.0 )

% ------------ Freestream ------------
MACH_NUMBER= 0.1
AOA= 4.0
SIDESLIP_ANGLE= 0.0
REYNOLDS_NUMBER= 100000.0
REYNOLDS_LENGTH= 1.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_DENSITY= 1.225
FREESTREAM_VELOCITY= ( 0.99756405, 0.06975647, 0.0 )
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ------------ Turbulence Inlet ------------
FREESTREAM_TURBULENCEINTENSITY= 0.001
FREESTREAM_TURB2LAMVISCRATIO= 5.0

% ------------ Mesh ------------
MESH_FILENAME= airfoil.su2
MESH_FORMAT= SU2

% ------------ Boundary Conditions ------------
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( airfoil )
MARKER_PLOTTING= ( airfoil )

% ------------ Numerical Method ------------
CONV_NUM_METHOD_FLOW= FDS
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= LEAST_SQUARES

% ------------ MUSCL & Limiter (1st-order cold start) ------------
MUSCL_FLOW= NO
MUSCL_TURB= NO
SLOPE_LIMITER_FLOW= NONE
SLOPE_LIMITER_TURB= NONE
VENKAT_LIMITER_COEFF= 0.05

% ------------ Time Integration ------------
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT

% ------------ CFL (conservative ceiling to prevent blow-up) ------------
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.2, 1.0, 5.0 )
CFL_REDUCTION_TURB= 0.95

% ------------ Iterations ------------
ITER= 1000

% ------------ Linear Solver ------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-6
LINEAR_SOLVER_ITER= 10

% ------------ Output ------------
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= (RESTART)
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= (INNER_ITER, RMS_RES, AERO_COEFF)
HISTORY_OUTPUT= (INNER_ITER, RMS_RES, AERO_COEFF)
CONV_STARTITER= 100
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1e-6
